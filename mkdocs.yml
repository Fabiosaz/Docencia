site_name: Docència · Fabio Saz
site_url: https://fabiosaz.github.io/Docencia/
site_author: Fabio Saz Pérez
site_description: Materials de Digitalització i Programació i Tractament de Dades (Illes Balears)
repo_url: https://github.com/Fabiosaz/Docencia
edit_uri: ""
copyright: >
  © 2026 Fabio Saz Pérez · Llicència <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.ca">CC BY-NC-SA 4.0</a><br>
  Adaptació al català i al currículum de les Illes Balears dels materials de
  <a href="https://lopegonzalez.es/eso-y-bachillerato/">Lope González Vázquez</a> (CC BY-NC-SA 4.0).

theme:
  name: material
  language: ca
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-night, name: Mode fosc}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle: {icon: material/weather-sunny, name: Mode clar}
  icon:
    logo: material/school

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight: {anchor_linenums: true, line_spans: __span}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Inici: index.md
  - Digitalització 4t ESO:
      - digitalitzacio/index.md
      - "Unitat 1. Dispositius digitals, sistemes operatius i de comunicació": digitalitzacio/u1-dispositius-digitals.md
      - "Unitat 2. Gestió de la informació": digitalitzacio/u2-gestio-informacio.md
      - "Unitat 3. Edició i creació de continguts": digitalitzacio/u3-edicio-creacio-continguts.md
      - "Unitat 4. Publicació i difusió de continguts": digitalitzacio/u4-publicacio-i-difusio.md
      - "Unitat 5. Seguretat i benestar digital": digitalitzacio/u5-seguretat-i-benestar.md
      - "Unitat 6. Comerç electrònic": digitalitzacio/u6-comerc-electronic.md
      - "Unitat 7. Ciutadania digital crítica": digitalitzacio/u7-ciutadania-digital-critica.md
  - PTD I:
      - ptd1/index.md
      - "Unitat 1. Pensament computacional i algorísmia": ptd1/u1-algorismia.md
      - "Unitat 2. Llenguatges de programació i entorns de desenvolupament": ptd1/u2-llenguatges-ide.md
      - "Unitat 3. Variables, tipus de dades i operadors": ptd1/u3-variables-tipus-operadors.md
      - "Unitat 4. Estructures condicionals": ptd1/u4-condicionals.md
      - "Unitat 5. Estructures iteratives": ptd1/u5-iteratives.md
      - "Unitat 6. Cadenes de caràcters": ptd1/u6-cadenes.md
      - "Unitat 7. Arrays: llistes i taules": ptd1/u7-arrays.md
  - PTD II:
      - ptd2/index.md
  - Sobre aquesta web: sobre.md
