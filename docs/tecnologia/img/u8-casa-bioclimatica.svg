<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" role="img" aria-label="Secció d'una casa amb la façana sud a l'esquerra. El sol alt de l'estiu queda aturat pel voladís i no entra per la finestra gran; el sol baix de l'hivern hi entra i escalfa l'interior. La casa té murs gruixats, aïllament a la coberta i una finestra petita al nord que permet la ventilació creuada">
